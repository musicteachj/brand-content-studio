name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  # Weekly, so a newly published advisory shows up on dev even in quiet weeks
  # instead of surprising the next unrelated PR.
  schedule:
    - cron: "0 13 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repo, so every job gets a read-only token. This
# limits the damage if a third-party action is ever compromised.
permissions:
  contents: read

# Each job's `name` is a required status check in the dev + main branch
# protection rules. Renaming a job means updating those rules too.
jobs:
  client:
    name: client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc # the one Node version for local dev, CI, and the image
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Node version matches the Docker image
        # The Dockerfile can't read .nvmrc, so fail if any Node stage drifts from
        # it. .nvmrc holds a bare major (e.g. 24); a leading "v" is tolerated.
        working-directory: .
        run: |
          want="node:$(tr -d '[:space:]' < .nvmrc | sed 's/^v//')-alpine"
          stages=$(grep -E '^FROM node:' Dockerfile || true)
          drift=$(printf '%s\n' "$stages" | grep -v "^FROM $want " || true)
          if [ -z "$stages" ] || [ -n "$drift" ]; then
            echo "Every Node stage in the Dockerfile should use $want to match .nvmrc:" >&2
            echo "${drift:-no FROM node: line found}" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm run format
      - run: npm run build # tsc -b && vite build: the gate that catches BUILD-01
      - run: npm test

  server:
    name: server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    # Mirror docker-compose: Mongo. With Mongo up the integration fixtures un-skip.
    # Chroma runs in-process (a temp directory per test run), so it needs no service.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      MONGODB_URL: mongodb://localhost:27017
      # A real (test-only) secret so config's production validator is exercised
      # without ever putting a live key in CI.
      JWT_SECRET_KEY: ci-test-secret-not-a-real-key-000000
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: No Chroma server anywhere
        # Chroma runs in-process (chromadb.PersistentClient). The server and its
        # advisories must never come back, so fail if any Chroma server image appears.
        working-directory: .
        run: |
          if grep -rn 'chromadb/chrom[a]:' docker-compose*.yml Dockerfile .github/workflows; then
            echo "A Chroma server image is referenced; Chroma must stay in-process." >&2
            exit 1
          fi
      - run: pip install -r requirements-dev.txt # runtime + ruff/mypy/pytest
      - run: ruff check app tests
      - run: mypy app
      - run: pytest -q # the Mongo service un-skips the integration fixtures

  # Builds the production image and boots it against real Mongo (Chroma runs inside it), so a
  # broken Dockerfile (DEP-02) or a secret baked into a layer (DEP-01) fails here
  # instead of at deploy time. Nothing is pushed anywhere.
  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Third-party actions are pinned to a commit SHA (a tag can be moved).
      # When upgrading, update the SHA and the version comment together.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: brand-content-studio:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: No secrets in the image
        # Mirrors the secret patterns .dockerignore excludes.
        run: |
          docker run --rm --entrypoint sh brand-content-studio:ci -c \
            'found=$(find /app \( -name ".env" -o -name ".env.*" -o -name "*.pem" -o -name "*.key" \) | grep -v "\.env\.example$")
             if [ -n "$found" ]; then
               echo "secret files were baked into the image:" >&2; echo "$found" >&2; exit 1
             fi'
      - name: Boot the image and wait for its HEALTHCHECK
        # As production runs it, with live AI off (a zero budget) and Cloudflare's
        # always-pass Turnstile test keys (allowed because APP_ORIGIN is loopback).
        # No AI key at all: the startup seed restores the demo from its fixtures.
        # Hardened like the ECS task (docs/DEPLOY.md): read-only root filesystem with a
        # /tmp tmpfs, no capabilities, no privilege escalation. The two data directories
        # get volumes, as in production (Docker gives a new volume the image directory's
        # owner, uid 10001), or the app's startup write check refuses to boot.
        run: |
          docker run -d --name bcs --network host \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            -v /app/storage -v /app/chroma \
            -e MONGODB_URL=mongodb://localhost:27017 \
            -e JWT_SECRET_KEY=ci-test-secret-not-a-real-key-000000 \
            -e APP_ORIGIN=http://localhost:8000 \
            -e FORWARDED_ALLOW_IPS=127.0.0.1 \
            -e TURNSTILE_SITE_KEY=1x00000000000000000000AA \
            -e TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA \
            -e AI_MONTHLY_BUDGET_USD=0 \
            brand-content-studio:ci
          # The HEALTHCHECK probes liveness, first one interval (30s) after start.
          for i in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Running}}' bcs)" != true ]; then
              echo "container exited during boot" >&2; exit 1
            fi
            status=$(docker inspect -f '{{.State.Health.Status}}' bcs)
            if [ "$status" = healthy ]; then echo "container is healthy"; exit 0; fi
            echo "waiting for healthy, currently $status ($i/60)"; sleep 3
          done
          echo "container never became healthy" >&2; exit 1
      - name: API is ready with the seed, the examples, and the SPA
        run: |
          # Readiness: Mongo, Chroma, and the startup seed (built from fixtures, no AI key).
          curl -sf http://127.0.0.1:8000/api/health | python3 -c \
            'import json, sys; d = json.load(sys.stdin); print(d); sys.exit(not (d["status"] == "ok" and d["seed"] is True))'
          # The four ready-made examples are public.
          curl -sf http://127.0.0.1:8000/api/examples | python3 -c \
            'import json, sys; n = len(json.load(sys.stdin)["items"]); print(n, "examples"); sys.exit(n != 4)'
          # Password sign-in does not exist in production.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d '{"email":"a@example.com","password":"x"}' http://127.0.0.1:8000/api/auth/login)
          test "$code" = 404 || { echo "POST /api/auth/login returned $code" >&2; exit 1; }
          curl -sf http://127.0.0.1:8000/ -o index.html
          grep -q 'id="root"' index.html
          # The bundle index.html loads must come back as JavaScript, not as
          # index.html again (that served a blank page; known-gaps plan, step 0).
          js=$(grep -oE 'src="/assets/[^"]+\.js"' index.html | head -1 | cut -d'"' -f2)
          test -n "$js" || { echo "no /assets/*.js in index.html" >&2; exit 1; }
          type=$(curl -sf -o /dev/null -w '%{content_type}' "http://127.0.0.1:8000$js")
          echo "$js -> $type"
          case "$type" in *javascript*) ;; *) echo "bundle served as $type" >&2; exit 1 ;; esac
          # An unknown API path is a 404, not the SPA.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/does-not-exist)
          test "$code" = 404 || { echo "/api/does-not-exist returned $code" >&2; exit 1; }
          # The SPA is served under an enforcing CSP (known-gaps plan, step 2) that lets
          # the Turnstile check load.
          csp=$(curl -sfI http://127.0.0.1:8000/login | grep -i "^content-security-policy:" || true)
          echo "$csp" | grep -qi "^content-security-policy: default-src 'self'" \
            || { echo "no enforcing Content-Security-Policy on the SPA" >&2; exit 1; }
          echo "$csp" | grep -q "https://challenges.cloudflare.com" \
            || { echo "the CSP does not allow Turnstile (https://challenges.cloudflare.com)" >&2; exit 1; }
      - name: Card export's harfbuzz wasm ships as a served asset
        # Satori's text shaper (harfbuzz) loads its wasm by URL. src/lib/harfbuzz.ts
        # points it at a hashed /assets/hb-<hash>.wasm; without that it fetched a bare
        # hb.wasm, got index.html back, and every card PNG export failed.
        run: |
          wasm=$(docker exec bcs sh -c 'cat /app/dist/assets/*.js' \
            | grep -oE '/assets/hb-[A-Za-z0-9_-]+\.wasm' | sort -u || true)
          n=$(printf '%s' "$wasm" | grep -c . || true)
          test "$n" = 1 || { echo "expected one /assets/hb-*.wasm in the built JS, found $n: $wasm" >&2; exit 1; }
          type=$(curl -sf -o /dev/null -w '%{content_type}' "http://127.0.0.1:8000$wasm")
          echo "$wasm -> $type"
          test "$type" = application/wasm || { echo "harfbuzz wasm served as $type" >&2; exit 1; }
      - name: Container logs
        if: failure()
        run: docker logs bcs || true

  # Known-vulnerable dependencies fail the build. Advisories with no fixed
  # release are allow-listed below, each with the reason it doesn't apply.
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pip install pip-audit==2.10.1
      - name: Python (runtime + dev tooling)
        # chromadb 1.5.9 has no fixed release for any of these. All four are in
        # Chroma's server; the package runs in-process only here (PersistentClient),
        # with no server and no listener, so none is reachable. Watch for a patched
        # release (docs/AUDIT-2026-07.md).
        #   GHSA-f4j7-r4q5-qw2c  pre-auth code injection
        #   GHSA-36p7-vc44-83pf  authenticated code injection
        #   GHSA-2wm9-hf6c-p5cr  missing authorization checks
        #   GHSA-xph7-9rjv-w5fr  SimpleRBACAuthorizationProvider bypass
        # pyjwt, no fixed release: decode() mutates a caller's `options` dict when
        # verify_signature is falsy. app/utils/security.py never passes options.
        #   GHSA-gvp8-978c-rx2q
        # pip-audit can't scope an ignore to a version, so when a fixed release
        # ships, upgrade and delete its line here.
        run: >-
          pip-audit -r server/requirements-dev.txt --progress-spinner off
          --ignore-vuln GHSA-f4j7-r4q5-qw2c
          --ignore-vuln GHSA-36p7-vc44-83pf
          --ignore-vuln GHSA-2wm9-hf6c-p5cr
          --ignore-vuln GHSA-xph7-9rjv-w5fr
          --ignore-vuln GHSA-gvp8-978c-rx2q
      - name: Client (shipped bundle)
        working-directory: client
        run: npm audit --omit=dev
      - name: Root dev scripts
        run: npm audit
      - name: Client dev tooling
        # Blocking since Vite 8, Vitest 5, and Tailwind 4 cleared the last
        # dev-tool advisories (they were report-only until then).
        working-directory: client
        run: npm audit
