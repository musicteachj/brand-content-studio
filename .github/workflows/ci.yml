name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  # Weekly, so a newly published advisory shows up on dev even in quiet weeks
  # instead of surprising the next unrelated PR.
  schedule:
    - cron: "0 13 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repo, so every job gets a read-only token. This
# limits the damage if a third-party action is ever compromised.
permissions:
  contents: read

# Each job's `name` is a required status check in the dev + main branch
# protection rules. Renaming a job means updating those rules too.
jobs:
  client:
    name: client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format
      - run: npm run build # tsc -b && vite build — the gate that catches BUILD-01
      - run: npm test

  server:
    name: server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    # Mirror docker-compose: both Mongo AND Chroma. With Mongo up the integration
    # fixtures un-skip, and some (e.g. asset reingest, which drops prior vectors)
    # then need the real vector store — so Chroma must be present too.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s --health-timeout 5s --health-retries 5
      chroma:
        # Pinned to match chromadb in server/requirements.txt (and docker-compose.yml).
        image: chromadb/chroma:1.5.9
        ports:
          - 8001:8000
    env:
      MONGODB_URL: mongodb://localhost:27017
      CHROMA_HOST: localhost
      CHROMA_PORT: "8001"
      # A real (test-only) secret so config's production validator is exercised
      # without ever putting a live key in CI.
      JWT_SECRET_KEY: ci-test-secret-not-a-real-key-000000
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Chroma client and server versions match
        # The chromadb pin and the chromadb/chroma image tags must move together.
        # Dependabot only bumps the pin, so fail its PR until the tags follow.
        working-directory: .
        run: |
          client=$(sed -n 's/^chromadb==\([^ ]*\).*/\1/p' server/requirements.txt)
          tags=$(grep -hE '^ *image: chromadb/chroma:' docker-compose.yml .github/workflows/ci.yml \
            | sed 's/.*image: //' | sort -u)
          echo "chromadb client: $client"; echo "server images:"; echo "$tags"
          if [ -z "$client" ] || [ "$tags" != "chromadb/chroma:$client" ]; then
            echo "Pin chromadb in server/requirements.txt and every chromadb/chroma image tag to the same version." >&2
            exit 1
          fi
      - run: pip install -r requirements-dev.txt # runtime + ruff/mypy/pytest
      - name: Wait for Chroma
        # The image ships no shell tooling we can use in a service --health-cmd,
        # so poll its heartbeat from the runner instead.
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8001/api/v2/heartbeat \
               || curl -sf http://localhost:8001/api/v1/heartbeat; then
              echo "chroma is up"; exit 0
            fi
            echo "waiting for chroma ($i/30)"; sleep 2
          done
          echo "chroma did not become ready" >&2; exit 1
      - run: ruff check app tests
      - run: mypy app
      - run: pytest -q # Mongo + Chroma services un-skip the integration fixtures

  # Builds the production image and boots it against real Mongo + Chroma, so a
  # broken Dockerfile (DEP-02) or a secret baked into a layer (DEP-01) fails here
  # instead of at deploy time. Nothing is pushed anywhere.
  docker:
    name: docker
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s --health-timeout 5s --health-retries 5
      chroma:
        image: chromadb/chroma:1.5.9
        ports:
          - 8001:8000
    steps:
      - uses: actions/checkout@v4
      # Third-party actions are pinned to a commit SHA (a tag can be moved);
      # Dependabot's github-actions updates keep the SHA and comment current.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          push: false
          tags: brand-content-studio:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: No secrets in the image
        # Mirrors the secret patterns .dockerignore excludes.
        run: |
          docker run --rm --entrypoint sh brand-content-studio:ci -c \
            'found=$(find /app \( -name ".env" -o -name ".env.*" -o -name "*.pem" -o -name "*.key" \) | grep -v "\.env\.example$")
             if [ -n "$found" ]; then
               echo "secret files were baked into the image:" >&2; echo "$found" >&2; exit 1
             fi'
      - name: Boot the image and wait for its HEALTHCHECK
        run: |
          docker run -d --name bcs --network host \
            -e MONGODB_URL=mongodb://localhost:27017 \
            -e CHROMA_HOST=localhost -e CHROMA_PORT=8001 \
            -e JWT_SECRET_KEY=ci-test-secret-not-a-real-key-000000 \
            brand-content-studio:ci
          # The Dockerfile's first probe fires one interval (30s) after start.
          for i in $(seq 1 40); do
            if [ "$(docker inspect -f '{{.State.Running}}' bcs)" != true ]; then
              echo "container exited during boot" >&2; exit 1
            fi
            status=$(docker inspect -f '{{.State.Health.Status}}' bcs)
            if [ "$status" = healthy ]; then echo "container is healthy"; exit 0; fi
            echo "waiting for healthy, currently $status ($i/40)"; sleep 3
          done
          echo "container never became healthy" >&2; exit 1
      - name: API reports both stores up and the SPA is served
        run: |
          curl -sf http://127.0.0.1:8000/api/health | python3 -c \
            'import json, sys; d = json.load(sys.stdin); print(d); sys.exit(d["status"] != "ok")'
          curl -sf http://127.0.0.1:8000/ | grep -q 'id="root"'
      - name: Container logs
        if: failure()
        run: docker logs bcs || true

  # Known-vulnerable dependencies fail the build. Advisories with no fixed
  # release are allow-listed below, each with the reason it doesn't apply.
  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install pip-audit==2.10.1
      - name: Python (runtime + dev tooling)
        # chromadb 1.5.9 has no fixed release for any of these. The server is
        # loopback-only in dev (docker-compose.yml) and runs without auth, so the
        # RBAC/authz ones don't apply; revisit at deploy (docs/AUDIT-2026-07.md).
        #   GHSA-f4j7-r4q5-qw2c  pre-auth code injection
        #   GHSA-36p7-vc44-83pf  authenticated code injection
        #   GHSA-2wm9-hf6c-p5cr  missing authorization checks
        #   GHSA-xph7-9rjv-w5fr  SimpleRBACAuthorizationProvider bypass
        # pyjwt, no fixed release: decode() mutates a caller's `options` dict when
        # verify_signature is falsy. app/utils/security.py never passes options.
        #   GHSA-gvp8-978c-rx2q
        # pip-audit can't scope an ignore to a version, so when a fixed release
        # ships, upgrade and delete its line here.
        run: >-
          pip-audit -r server/requirements-dev.txt --progress-spinner off
          --ignore-vuln GHSA-f4j7-r4q5-qw2c
          --ignore-vuln GHSA-36p7-vc44-83pf
          --ignore-vuln GHSA-2wm9-hf6c-p5cr
          --ignore-vuln GHSA-xph7-9rjv-w5fr
          --ignore-vuln GHSA-gvp8-978c-rx2q
      - name: Client (shipped bundle)
        working-directory: client
        run: npm audit --omit=dev
      - name: Root dev scripts
        run: npm audit
      - name: Client dev tooling (report-only)
        # The remaining advisories here sit in the dev server, test runner, and
        # Tailwind's build-time deps; their fixes need major upgrades (vite 8,
        # vitest 5, tailwindcss 4). Surface them as a warning until then.
        working-directory: client
        run: |
          if ! npm audit; then
            echo "::warning title=Client dev-tooling advisories::npm audit found advisories in client devDependencies (not shipped). Fixes need major upgrades; see the log above."
          fi
