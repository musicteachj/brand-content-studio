# Weekly dependency update PRs, opened against dev like any other branch.
# Minor + patch bumps are grouped into one PR per ecosystem to keep the noise
# down; major bumps arrive as their own PRs since they usually need code changes.
# CI (including the audit job) runs on every one of them.
#
# Not covered: the chromadb/chroma image tags in docker-compose.yml and ci.yml.
# A chromadb package bump fails CI (server job) until those tags match it, so
# update them in the same PR.
version: 2
updates:
  - package-ecosystem: pip
    directory: /server
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /client
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      client-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      root-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
