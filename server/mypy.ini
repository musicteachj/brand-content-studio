[mypy]
python_version = 3.12
ignore_missing_imports = True
# Motor builds its AsyncIOMotor* classes dynamically, so their stubs resolve to
# values mypy can't use as types or attribute-check. `follow_imports = skip`
# below is what actually solves that (its symbols become Any) — a global
# disable_error_code is NOT needed, and would blind attr-defined across all 55
# files to appease one library.

[mypy-motor.*]
follow_imports = skip
ignore_missing_imports = True

[mypy-chromadb.*]
ignore_missing_imports = True

[mypy-pdfplumber.*]
ignore_missing_imports = True

# Deferred-phase stub: methods are intentionally empty (the constructor raises).
[mypy-app.rag.qdrant_store]
disable_error_code = empty-body
