[mypy]
python_version = 3.12
ignore_missing_imports = True
# Motor builds its AsyncIOMotor* classes dynamically, so their stubs resolve to
# values mypy can't use as types or attribute-check. Skip into motor and treat
# its symbols as Any rather than littering the codebase with casts.
disable_error_code = valid-type, attr-defined

[mypy-motor.*]
follow_imports = skip
ignore_missing_imports = True

[mypy-chromadb.*]
ignore_missing_imports = True

[mypy-pdfplumber.*]
ignore_missing_imports = True

# Deferred-phase stub: methods are intentionally empty (the constructor raises).
[mypy-app.rag.qdrant_store]
disable_error_code = empty-body
