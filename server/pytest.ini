[pytest]
asyncio_mode = auto
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
    # A deprecated Starlette status-code name ('HTTP_413_REQUEST_ENTITY_TOO_LARGE' and
    # friends) fails the suite instead of piling up as noise. StarletteDeprecationWarning
    # is a UserWarning, so the line above doesn't cover it.
    error:'HTTP_\d+_\w+' is deprecated:starlette.exceptions.StarletteDeprecationWarning
