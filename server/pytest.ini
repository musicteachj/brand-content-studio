[pytest]
asyncio_mode = auto
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
    # Any Starlette deprecation (an old status-code name such as
    # 'HTTP_413_REQUEST_ENTITY_TOO_LARGE', TestClient running on httpx instead of httpx2)
    # fails the suite instead of piling up as noise. StarletteDeprecationWarning is a
    # UserWarning, so the line above doesn't cover it.
    error::starlette.exceptions.StarletteDeprecationWarning
